<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>マイダッシュボード</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root {
  --primary: #1967d2;
  --primary-hover: #1557b0;
  --bg-color: #f8f9fa;
  --card-bg: #ffffff;
  --text-main: #202124;
  --text-sub: #5f6368;
  --border-color: #dadce0;
  --radius: 12px;
} /* ←ここでいったん `:root` を閉じる */

/* ── ここにダークモードの色設定を置く ── */
body.dark-mode {
  --bg-color: #121212;
  --card-bg: #1e1e1e;
  --text-main: #f0f0f0;
  --text-sub: #aaaabb;
  --border-color: #333333;
}



    body {

      font-family: 'Google Sans', Roboto, Arial, sans-serif;

      background-color: var(--bg-color);

      color: var(--text-main);

      max-width: 800px;

      margin: 0 auto;

      padding: 0 0 40px 0;

      box-sizing: border-box;

    }

    /* ヘッダー風のバー */

    header {

      background: var(--card-bg);

      border-bottom: 1px solid var(--border-color);

      padding: 16px 20px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      position: sticky;

      top: 0;

      z-index: 10;

    }

    header h1 {

      font-size: 18px;

      margin: 0;

      color: var(--primary);

      font-weight: 500;

    }

    .user-area {

      font-size: 13px;

      color: var(--text-sub);

      display: flex;

      align-items: center;

      gap: 10px;

    }

    .container {

      padding: 16px;

    }

    /* カードデザイン */

    .card {

      background: var(--card-bg);

      border: 1px solid var(--border-color);

      border-radius: var(--radius);

      padding: 20px;

      margin-bottom: 20px;

      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);

    }

    .card h2 {

      font-size: 16px;

      margin-top: 0;

      margin-bottom: 14px;

      color: var(--text-main);

      border-bottom: 2px solid var(--primary);

      padding-bottom: 6px;

      display: inline-block;

    }

    input[type="text"], input[type="email"], input[type="password"], textarea, input[type="file"] {

      font-size: 15px;

      padding: 12px;

      border-radius: 8px;

      border: 1px solid var(--border-color);

      width: 100%;

      box-sizing: border-box;

      margin-bottom: 12px;

      background: #fff;

      outline: none;

      transition: border 0.2s;

    }

    input:focus, textarea:focus {

      border-color: var(--primary);

      box-shadow: 0 0 0 2px rgba(26,115,232,0.2);

    }

    button {

      background: var(--primary);

      color: #fff;

      border: none;

      cursor: pointer;

      font-weight: 500;

      font-size: 14px;

      padding: 10px 18px;

      border-radius: 8px;

      transition: background 0.2s;

    }

    button:hover {

      background: var(--primary-hover);

    }

    button.secondary {

      background: #f1f3f4;

      color: var(--text-main);

      border: 1px solid var(--border-color);

    }

    button.secondary:hover {

      background: #e8eaed;

    }

    button.danger {

      background: #d93025;

    }

    button.danger:hover {

      background: #b31412;

    }

    .row {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 12px;

      padding: 12px 0;

      border-bottom: 1px solid #f1f3f4;

    }

    .row:last-child {

      border-bottom: none;

    }

    .hidden {

      display: none;

    }

    .status {

      background: #e8f0fe;

      color: var(--primary);

      padding: 10px 14px;

      border-radius: 8px;

      font-size: 14px;

      margin-bottom: 16px;

    }

    .btn-group {

      display: flex;

      gap: 6px;

      flex-wrap: wrap;

    }

    /* ダークモード時の視認性調整（追加分） */
    body.dark-mode input[type="text"],
    body.dark-mode input[type="email"],
    body.dark-mode input[type="password"],
    body.dark-mode textarea,
    body.dark-mode input[type="file"] {
      background: #2a2a2a;
      color: var(--text-main);
    }

    body.dark-mode button.secondary {
      background: #2c2c2c;
      color: var(--text-main);
    }

    body.dark-mode button.secondary:hover {
      background: #3a3a3a;
    }

  </style>

</head>

<body>



  <!-- Classroom風ヘッダー -->

  <header>

    <h1>📚 マイダッシュボード</h1>

    <div id="header-user" class="hidden user-area">

      <span id="user-email"></span>

      <button id="logout-btn" class="secondary" style="padding:6px 12px;font-size:12px;margin:0;">ログアウト</button>

    </div>

  </header>



  <div class="container">

    <div id="status" class="status hidden"></div>



    <!-- ログイン画面 -->

    <div id="auth-box" class="card" style="max-width: 400px; margin: 40px auto;">

      <h2>ログイン</h2>

      <input id="email" type="email" placeholder="メールアドレス" autocomplete="username" />

      <input id="password" type="password" placeholder="パスワード" autocomplete="current-password" />

      <button id="login-btn" style="width:100%;">ログイン</button>

    </div>



      <!-- アプリ本体 -->
    <div id="app-box" class="hidden">

         <!-- スマホのステータスカード -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
          <h2 style="margin-bottom: 0;">📱 スマホのステータス</h2>
          <button id="refresh-device-btn" type="button" class="secondary" style="padding: 6px 12px; font-size: 12px;">🔄 更新</button>
        </div>
        <div id="device-status-body" style="font-size: 14px; line-height: 1.8;">
          <p style="margin: 4px 0;"><strong>端末名:</strong> <span id="dev-name">読み込み中...</span></p>
          <p style="margin: 4px 0;"><strong>Wi-Fi:</strong> <span id="dev-wifi">--</span></p>
          <!-- ▼ ここにバッテリーを追加 ▼ -->
          <p style="margin: 4px 0;"><strong>バッテリー:</strong> <span id="dev-battery">--</span>%</p>
          <p style="margin: 4px 0;"><strong>音量(着信):</strong> <span id="dev-ringer">--</span></p>
          <p style="margin: 4px 0;"><strong>空き容量:</strong> <span id="dev-storage">--</span></p>
          <p style="margin: 4px 0;"><strong>直近の通知:</strong> <span id="dev-notif">--</span></p>
          <p style="margin: 8px 0 0 0; font-size: 12px; color: var(--text-sub);">最終確認: <span id="dev-time">--</span></p>
        </div>
      </div>


      <!-- メモ作成・一覧カード -->

      <div class="card">

        <h2>メモ</h2>

        <input id="note-title" type="text" placeholder="タイトル" />

        <textarea id="note-content" rows="3" placeholder="メモの内容を入力..."></textarea>

        <button id="add-note-btn">メモを保存</button>

        <div id="notes-list" style="margin-top: 14px;"></div>

      </div>



      <!-- ファイル管理カード -->

      <div class="card">

        <h2>ファイルストレージ</h2>

        <input id="file-input" type="file" />

        <button id="upload-btn">アップロード</button>

        <div id="files-list" style="margin-top: 14px;"></div>

      </div>
        <!-- YouTube検索＆再生カード -->
<div class="card">
  <h2>YouTube 検索</h2>


      <!-- ★ここから追加：ダークモード・履歴・あとで見るボタン -->
      <div style="margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
        <button id="themeToggle" type="button" class="secondary" style="padding: 6px 12px; font-size: 13px;">🌙 ダークモード</button>
        <button id="showHistoryBtn" type="button" class="secondary" style="padding: 6px 12px; font-size: 13px;">🕒 履歴</button>
        <button id="showWatchLaterBtn" type="button" class="secondary" style="padding: 6px 12px; font-size: 13px;">📌 あとで見る</button>
      </div>

      <!-- 履歴やあとで見るの一覧が出る場所 -->
      <div id="saved-list-wrap" style="display: none; margin-bottom: 14px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px;">
          <strong id="saved-list-title" style="font-size: 14px;">一覧</strong>
          <div style="display: flex; gap: 6px;">
            <button id="clearSavedListBtn" type="button" class="danger" style="padding: 4px 8px; font-size: 12px;">一括削除</button>
            <button id="closeSavedList" type="button" class="secondary" style="padding: 4px 8px; font-size: 12px;">✕ 閉じる</button>
          </div>
        </div>
        <div id="saved-list" style="display: grid; gap: 8px;"></div>
      </div>
      <!-- ★ここまで追加 -->

      <div style="display: flex; gap: 8px; margin-bottom: 12px;">

            <input
              id="yt-query"
              type="text"
              placeholder="キーワードを入力..."
              style="flex: 1; margin: 0;"
            />
            <button
              id="yt-search-btn"
              type="button"
              style="margin: 0; white-space: nowrap;"
            >
              検索
            </button>
          </div>

          <div id="yt-player-wrap" style="display: none; aspect-ratio: 16 / 9; margin-bottom: 14px;">
            <iframe
              id="yt-player"
              width="100%"
              height="100%"
              style="border: 0; border-radius: 10px;"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>

          <div id="yt-results" style="display: grid; gap: 10px;"></div>
        </div>



    </div>

  </div>



  <script>

    const SUPABASE_URL = "https://kovmdyvddmtqiixrjjux.supabase.co";

    const SUPABASE_KEY = "sb_publishable_mkn7AP0QE1XIhmALoVLaqA_Vtg-XZ55";

    const BUCKET = "user-files";



    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {

      auth: { persistSession: true, autoRefreshToken: true }

    });



    const statusEl = document.getElementById("status");

    const authBox = document.getElementById("auth-box");

    const appBox = document.getElementById("app-box");

    const headerUser = document.getElementById("header-user");

    const userEmail = document.getElementById("user-email");

    const notesList = document.getElementById("notes-list");

    const filesList = document.getElementById("files-list");



    let currentUser = null;



    function setStatus(msg) {

      if (!msg) {

        statusEl.classList.add("hidden");

        statusEl.textContent = "";

      } else {

        statusEl.textContent = msg;

        statusEl.classList.remove("hidden");

      }

    }



    document.getElementById("login-btn").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;

      setStatus("ログイン中...");

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) setStatus("ログイン失敗: " + error.message);

      else setStatus("");

    });



    document.getElementById("logout-btn").addEventListener("click", async () => {

      await sb.auth.signOut();

    });



    document.getElementById("add-note-btn").addEventListener("click", async () => {

      if (!currentUser) return;

      const title = document.getElementById("note-title").value.trim() || "無題のメモ";

      const content = document.getElementById("note-content").value;

      const { error } = await sb.from("notes").insert({

        user_id: currentUser.id,

        title,

        content

      });

      if (error) return setStatus("メモ保存エラー: " + error.message);

      document.getElementById("note-title").value = "";

      document.getElementById("note-content").value = "";

      setStatus("メモを保存しました");

      await loadNotes();

    });



    async function loadNotes() {

      const { data, error } = await sb

        .from("notes")

        .select("*")

        .order("updated_at", { ascending: false });

      if (error) return setStatus("メモ読込エラー: " + error.message);



      notesList.innerHTML = "";

      if (!data || data.length === 0) {

        notesList.innerHTML = '<div style="color:#5f6368;font-size:14px;padding:8px 0;">メモはまだありません</div>';

        return;

      }



      data.forEach((n) => {

        const div = document.createElement("div");

        div.className = "row";

        div.innerHTML = `

          <div style="flex:1; word-break: break-all;">

            <strong style="font-size:15px; color:#202124;">${escapeHtml(n.title)}</strong>

            <div style="white-space:pre-wrap; color:#5f6368; font-size:14px; margin-top:4px;">${escapeHtml(n.content)}</div>

          </div>

          <button class="danger btn-del" style="padding:6px 10px;font-size:12px;">削除</button>

        `;

        div.querySelector(".btn-del").addEventListener("click", async () => {

          const { error: delErr } = await sb.from("notes").delete().eq("id", n.id);

          if (delErr) setStatus("削除エラー: " + delErr.message);

          else {

            setStatus("メモを削除しました");

            await loadNotes();

          }

        });

        notesList.appendChild(div);

      });

    }



    document.getElementById("upload-btn").addEventListener("click", async () => {

      if (!currentUser) return;

      const file = document.getElementById("file-input").files[0];

      if (!file) return setStatus("ファイルを選んでください");

      const path = `${currentUser.id}/${Date.now()}_${file.name}`;

      setStatus("アップロード中...");

      const { error } = await sb.storage.from(BUCKET).upload(path, file);

      if (error) return setStatus("アップロードエラー: " + error.message);

      document.getElementById("file-input").value = "";

      setStatus("アップロード完了しました");

      await loadFiles();

    });



    async function loadFiles() {

      if (!currentUser) return;

      const { data, error } = await sb.storage.from(BUCKET).list(currentUser.id, {

        sortBy: { column: "created_at", order: "desc" }

      });

      if (error) return setStatus("ファイル一覧エラー: " + error.message);



      filesList.innerHTML = "";

      const validFiles = (data || []).filter((f) => f.name !== ".emptyFolderPlaceholder");

      if (validFiles.length === 0) {

        filesList.innerHTML = '<div style="color:#5f6368;font-size:14px;padding:8px 0;">ファイルはまだありません</div>';

        return;

      }



      validFiles.forEach((f) => {

        const fullPath = `${currentUser.id}/${f.name}`;

        const div = document.createElement("div");

        div.className = "row";

        div.innerHTML = `

          <span style="word-break: break-all; flex:1; font-size:14px; color:#202124;">${escapeHtml(f.name)}</span>

          <div class="btn-group">

            <button class="secondary btn-open" style="padding:6px 10px;font-size:12px;">開く</button>

            <button class="secondary btn-download" style="padding:6px 10px;font-size:12px;">DL</button>

            <button class="danger btn-del" style="padding:6px 10px;font-size:12px;">削除</button>

          </div>

        `;

        const openBtn = div.querySelector(".btn-open");

        const downloadBtn = div.querySelector(".btn-download");

        const delBtn = div.querySelector(".btn-del");



        openBtn.addEventListener("click", async () => {

          const { data: signed, error: urlErr } = await sb.storage

            .from(BUCKET)

            .createSignedUrl(fullPath, 60);

          if (urlErr) setStatus("URL発行エラー: " + urlErr.message);

          else window.open(signed.signedUrl, "_blank");

        });



        downloadBtn.addEventListener("click", async () => {

          const { data: signed, error: urlErr } = await sb.storage

            .from(BUCKET)

            .createSignedUrl(fullPath, 60, { download: f.name });

          if (urlErr) setStatus("URL発行エラー: " + urlErr.message);

          else window.open(signed.signedUrl, "_blank");

        });



        delBtn.addEventListener("click", async () => {

          const { error: delErr } = await sb.storage.from(BUCKET).remove([fullPath]);

          if (delErr) setStatus("削除エラー: " + delErr.message);

          else {

            setStatus("ファイルを削除しました");

            await loadFiles();

          }

        });

        filesList.appendChild(div);

      });

    }



    function escapeHtml(str) {

      return String(str).replace(/[&<>"']/g, (m) => ({

        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"

      }[m]));

    }



    sb.auth.onAuthStateChange(async (_event, session) => {

      currentUser = session?.user || null;

      if (currentUser) {

        authBox.classList.add("hidden");

        appBox.classList.remove("hidden");

        headerUser.classList.remove("hidden");

        userEmail.textContent = currentUser.email;

        await Promise.all([loadNotes(), loadFiles()]);

      } else {

        authBox.classList.remove("hidden");

        appBox.classList.add("hidden");

        headerUser.classList.add("hidden");

        userEmail.textContent = "";

      }

    });
      const YT_API_KEY = "AIzaSyDJtY2Bx-lGDt5h_JcQZ4WyI-4i2KseCtQ";

      const ytInputEl = document.getElementById("yt-query");
      const ytBtnEl = document.getElementById("yt-search-btn");
      const ytResultsEl = document.getElementById("yt-results");
      const ytPlayerWrapEl = document.getElementById("yt-player-wrap");
      const ytPlayerEl = document.getElementById("yt-player");

      function escapeYtHtml(str) {
        return str
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      async function searchYouTube() {
        const q = ytInputEl.value.trim();
        if (!q) return;

        ytResultsEl.innerHTML = "<p>検索中...</p>";

        const url = new URL("https://www.googleapis.com/youtube/v3/search");
        url.searchParams.set("part", "snippet");
        url.searchParams.set("type", "video");
        url.searchParams.set("maxResults", "6");
        url.searchParams.set("q", q);
        url.searchParams.set("key", YT_API_KEY);

        try {
          const res = await fetch(url);
          const data = await res.json();

          if (!res.ok) {
            ytResultsEl.innerHTML = `<p>検索エラー: ${escapeYtHtml(data.error?.message || "取得できませんでした")}</p>`;
            return;
          }

          if (!data.items || data.items.length === 0) {
            ytResultsEl.innerHTML = "<p>動画が見つかりませんでした。</p>";
            return;
          }

          ytResultsEl.innerHTML = "";
          data.items.forEach((item) => {
            const videoId = item.id?.videoId;
            const title = item.snippet?.title || "タイトルなし";
            const thumb = item.snippet?.thumbnails?.medium?.url || "";
            if (!videoId) return;

            const card = document.createElement("div");
            card.style.cssText =
              "display:flex; gap:10px; align-items:center; padding:8px; border:1px solid var(--border-color); border-radius:8px; cursor:pointer;";
            card.innerHTML = `
              <img src="${thumb}" alt="" style="width:120px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; flex-shrink:0;" />
              <div style="flex:1; font-size:14px; line-height:1.4;">${escapeYtHtml(title)}</div>
              <button type="button" class="secondary btn-watch-later" style="padding:6px 10px; font-size:12px; flex-shrink:0;">📌 あとで見る</button>
            `;

            card.querySelector(".btn-watch-later").addEventListener("click", (e) => {
              e.stopPropagation();
              addToWatchLater(videoId, title);
            });

            card.addEventListener("click", () => {
              ytPlayerEl.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
              ytPlayerWrapEl.style.display = "block";
              ytPlayerWrapEl.scrollIntoView({behavior: "smooth", block: "nearest"});
              addToHistory(videoId, title); // ★ここで履歴に自動保存！
            });


            ytResultsEl.appendChild(card);
          });
        } catch (err) {
          ytResultsEl.innerHTML = "<p>通信エラーが発生しました。</p>";
        }
      }

      ytBtnEl.addEventListener("click", searchYouTube);
      ytInputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") searchYouTube();
      });
  // ── 視聴履歴とあとで見るの保存機能 ──
  function getSavedVideos(key) {
    return JSON.parse(localStorage.getItem(key)) || [];
  }
  function saveVideo(key, videoId, title) {
    let list = getSavedVideos(key);
    list = list.filter(item => item.id !== videoId);
    list.unshift({ id: videoId, title: title });
    if (list.length > 20) list.pop();
    localStorage.setItem(key, JSON.stringify(list));
    if (activeListKey === key) renderSavedList(key);
  }
  function addToHistory(videoId, title) {
    saveVideo('watch_history', videoId, title);
  }
  function addToWatchLater(videoId, title) {
    saveVideo('watch_later', videoId, title);
    alert('「あとで見る」に追加しました！');
  }

 // ── ダークモード切り替え機能 ──
  const themeToggleBtn = document.getElementById("themeToggle");
  function applyTheme(isDark) {
    document.body.classList.toggle("dark-mode", isDark);
    themeToggleBtn.textContent = isDark ? "☀️ ライトモード" : "🌙 ダークモード";
  }
  applyTheme(localStorage.getItem("dashboard_dark_mode") === "true");

  themeToggleBtn.addEventListener("click", () => {
    const nextDark = !document.body.classList.contains("dark-mode");
    localStorage.setItem("dashboard_dark_mode", String(nextDark));
    applyTheme(nextDark);
  });

  // ── 履歴・あとで見るの一覧表示・個別削除・一括削除機能 ──
  const savedListWrap = document.getElementById("saved-list-wrap");
  const savedListTitle = document.getElementById("saved-list-title");
  const savedListEl = document.getElementById("saved-list");
  const showHistoryBtn = document.getElementById("showHistoryBtn");
  const showWatchLaterBtn = document.getElementById("showWatchLaterBtn");
  const clearSavedListBtn = document.getElementById("clearSavedListBtn");
  const closeSavedListBtn = document.getElementById("closeSavedList");

  let activeListKey = null;

  function renderSavedList(key) {
    activeListKey = key;
    savedListTitle.textContent = key === "watch_history" ? "🕒 視聴履歴" : "📌 あとで見る";
    savedListWrap.style.display = "block";

    const list = getSavedVideos(key);
    savedListEl.innerHTML = "";

    if (list.length === 0) {
      clearSavedListBtn.style.display = "none";
      savedListEl.innerHTML = `<div style="font-size:13px; color:var(--text-sub); padding:4px 0;">保存されている動画はありません</div>`;
      return;
    }

    clearSavedListBtn.style.display = "inline-block";

    list.forEach((item) => {
      const row = document.createElement("div");
      row.style.cssText =
        "display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--border-color); border-radius:6px;";

      const titleSpan = document.createElement("span");
      titleSpan.textContent = item.title;
      titleSpan.style.cssText =
        "flex:1; font-size:13px; cursor:pointer; word-break:break-all;";
      titleSpan.addEventListener("click", () => {
        ytPlayerEl.src = `https://www.youtube-nocookie.com/embed/${item.id}?autoplay=1`;
        ytPlayerWrapEl.style.display = "block";
        ytPlayerWrapEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
        if (key !== "watch_history") {
          addToHistory(item.id, item.title);
        }
      });

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "danger";
      delBtn.textContent = "削除";
      delBtn.style.cssText = "padding:4px 8px; font-size:12px; flex-shrink:0;";
      delBtn.addEventListener("click", () => {
        const updated = getSavedVideos(key).filter((v) => v.id !== item.id);
        localStorage.setItem(key, JSON.stringify(updated));
        renderSavedList(key);
      });

      row.appendChild(titleSpan);
      row.appendChild(delBtn);
      savedListEl.appendChild(row);
    });
  }

  showHistoryBtn.addEventListener("click", () => {
    if (savedListWrap.style.display === "block" && activeListKey === "watch_history") {
      savedListWrap.style.display = "none";
      activeListKey = null;
    } else {
      renderSavedList("watch_history");
    }
  });

  showWatchLaterBtn.addEventListener("click", () => {
    if (savedListWrap.style.display === "block" && activeListKey === "watch_later") {
      savedListWrap.style.display = "none";
      activeListKey = null;
    } else {
      renderSavedList("watch_later");
    }
  });

  clearSavedListBtn.addEventListener("click", () => {
    if (!activeListKey) return;
    const label = activeListKey === "watch_history" ? "視聴履歴" : "あとで見る";
    if (!confirm(`${label}をすべて削除しますか？`)) return;
    localStorage.removeItem(activeListKey);
    renderSavedList(activeListKey);
  });

  closeSavedListBtn.addEventListener("click", () => {
    savedListWrap.style.display = "none";
    activeListKey = null;
  });
        // ── スマホのステータス取得機能 ──
        async function loadDeviceStatus() {
      const nameEl = document.getElementById("dev-name");
      const wifiEl = document.getElementById("dev-wifi");
      const batteryEl = document.getElementById("dev-battery"); // ←追加
      const ringerEl = document.getElementById("dev-ringer");
      const storageEl = document.getElementById("dev-storage");
      const notifEl = document.getElementById("dev-notif");
      const timeEl = document.getElementById("dev-time");

      const { data, error } = await sb
        .from("device_status")
        .select("*")
        .order("id", { ascending: false })
        .limit(1);

      if (error) {
        if (nameEl) nameEl.textContent = "取得エラー: " + error.message;
        return;
      }

      if (data && data.length > 0) {
        const latest = data[0];
        if (nameEl) nameEl.textContent = latest.device_name || "不明";
        if (wifiEl) wifiEl.textContent = latest.wifi_status || latest.wifi_ssid || "未接続";
        
        // ▼ バッテリー残量を反映 ▼
        if (batteryEl) {
          batteryEl.textContent = latest.battery_level ?? "--";
        }

        if (ringerEl) ringerEl.textContent = latest.volume_ringer ?? "--";
        if (storageEl) storageEl.textContent = latest.free_internal_storage ? `${latest.free_internal_storage} GB` : "--";
        if (notifEl) notifEl.textContent = latest.last_notification || "なし";
        if (timeEl) timeEl.textContent = new Date().toLocaleTimeString("ja-JP");
      } else {
        if (nameEl) nameEl.textContent = "データがありません";
      }
    }


    // ログインしたときに自動でステータスも読み込む
    const originalAuthStateChange = sb.auth.onAuthStateChange;
    sb.auth.onAuthStateChange(async (_event, session) => {
      if (session?.user) {
        // ログイン成功時にステータスを読み込む
        setTimeout(loadDeviceStatus, 500);
      }
    });

    // 🔄 更新ボタンのクリックイベント
    document.addEventListener("click", (e) => {
      if (e.target && e.target.id === "refresh-device-btn") {
        loadDeviceStatus();
      }
    });

  </script>
