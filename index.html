<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マイダッシュボード</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #1967d2;
      --primary-hover: #1557b0;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #202124;
      --text-sub: #5f6368;
      --border-color: #dadce0;
      --radius: 12px;
    }
    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f0f0f0;
      --text-sub: #aaaabb;
      --border-color: #333333;
    }
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      max-width: 800px;
      margin: 0 auto;
      padding: 0 0 40px 0;
      box-sizing: border-box;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-size: 18px;
      margin: 0;
      color: var(--primary);
      font-weight: 500;
    }
    .user-area {
      font-size: 13px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .container {
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    }
    .card h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 14px;
      color: var(--text-main);
      border-bottom: 2px solid var(--primary);
      padding-bottom: 6px;
      display: inline-block;
    }
    input[type="text"], input[type="email"], input[type="password"], textarea, input[type="file"] {
      font-size: 15px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      transition: border 0.2s;
    }
    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--primary-hover);
    }
    button.secondary {
      background: #f1f3f4;
      color: #202124;
      border: 1px solid var(--border-color);
    }
    body.dark-mode button.secondary {
      background: #2d2d2d;
      color: #f0f0f0;
      border-color: #444;
    }
    button.secondary:hover {
      background: #e8eaed;
    }
    body.dark-mode button.secondary:hover {
      background: #383838;
    }
    button.danger {
      background: #d93025;
      color: #fff;
    }
    button.danger:hover {
      background: #b31412;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .row:last-child {
      border-bottom: none;
    }
    .hidden {
      display: none;
    }
    .status {
      background: #e8f0fe;
      color: var(--primary);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <h1>📚 マイダッシュボード</h1>
    <div id="header-user" class="hidden user-area">
      <span id="user-email"></span>
      <button id="logout-btn" class="secondary" style="padding:6px 12px;font-size:12px;margin:0;">ログアウト</button>
    </div>
  </header>

  <div class="container">
    <div id="status" class="status hidden"></div>

    <!-- ログイン画面 -->
    <div id="auth-box" class="card" style="max-width: 400px; margin: 40px auto;">
      <h2>ログイン</h2>
      <input id="email" type="email" placeholder="メールアドレス" autocomplete="username" />
      <input id="password" type="password" placeholder="パスワード" autocomplete="current-password" />
      <button id="login-btn" style="width:100%;">ログイン</button>
    </div>

    <!-- アプリ本体 -->
    <div id="app-box" class="hidden">
      
      <!-- メモ作成・一覧カード -->
      <div class="card">
        <h2>メモ</h2>
        <input id="note-title" type="text" placeholder="タイトル" />
        <textarea id="note-content" rows="3" placeholder="メモの内容を入力..."></textarea>
        <button id="add-note-btn">メモを保存</button>
        <div id="notes-list" style="margin-top: 14px;"></div>
      </div>

      <!-- ファイル管理カード -->
      <div class="card">
        <h2>ファイルストレージ</h2>
        <input id="file-input" type="file" />
        <button id="upload-btn">アップロード</button>
        <div id="files-list" style="margin-top: 14px;"></div>
      </div>

      <!-- YouTube検索＆再生カード -->
      <div class="card">
        <h2>YouTube 検索</h2>

        <!-- ダークモード・履歴・あとで見るボタン -->
        <div style="margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
          <button id="themeToggle" type="button" class="secondary" style="padding: 6px 12px; font-size: 13px;">🌙 ダークモード</button>
          <button id="showHistoryBtn" type="button" class="secondary" style="padding: 6px 12px; font-size: 13px;">🕒 履歴</button>
          <button id="showWatchLaterBtn" type="button" class="secondary" style="padding: 6px 12px; font-size: 13px;">📌 あとで見る</button>
        </div>

        <!-- 履歴・あとで見るの一覧（すべてクリアボタン付き） -->
        <div id="saved-list-wrap" style="display: none; margin-bottom: 14px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <strong id="saved-list-title" style="font-size: 14px;">一覧</strong>
            <div style="display: flex; gap: 6px;">
              <button id="clearAllBtn" type="button" class="danger" style="padding: 4px 8px; font-size: 11px;">すべてクリア</button>
              <button id="closeSavedList" type="button" class="secondary" style="padding: 4px 8px; font-size: 12px;">✕ 閉じる</button>
            </div>
          </div>
          <div id="saved-list" style="display: grid; gap: 8px;"></div>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
          <input id="yt-query" type="text" placeholder="キーワードを入力..." style="flex: 1; margin: 0;" />
          <button id="yt-search-btn" type="button" style="margin: 0; white-space: nowrap;">検索</button>
        </div>

        <div id="yt-player-wrap" style="display: none; aspect-ratio: 16 / 9; margin-bottom: 14px;">
          <iframe id="yt-player" width="100%" height="100%" style="border: 0; border-radius: 10px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <div id="yt-results" style="display: grid; gap: 10px;"></div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://kovmdyvddmtqiixrjjux.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mkn7AP0QE1XIhmALoVLaqA_Vtg-XZ55";
    const BUCKET = "user-files";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });

    const statusEl = document.getElementById("status");
    const authBox = document.getElementById("auth-box");
    const appBox = document.getElementById("app-box");
    const headerUser = document.getElementById("header-user");
    const userEmail = document.getElementById("user-email");
    const notesList = document.getElementById("notes-list");
    const filesList = document.getElementById("files-list");

    let currentUser = null;

    function setStatus(msg) {
      if (!msg) {
        statusEl.classList.add("hidden");
        statusEl.textContent = "";
      } else {
        statusEl.textContent = msg;
        statusEl.classList.remove("hidden");
      }
    }

    document.getElementById("login-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      setStatus("ログイン中...");
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) setStatus("ログイン失敗: " + error.message);
      else setStatus("");
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await sb.auth.signOut();
    });

    document.getElementById("add-note-btn").addEventListener("click", async () => {
      if (!currentUser) return;
      const title = document.getElementById("note-title").value.trim() || "無題のメモ";
      const content = document.getElementById("note-content").value;
      const { error } = await sb.from("notes").insert({
        user_id: currentUser.id,
        title,
        content
      });
      if (error) return setStatus("メモ保存エラー: " + error.message);
      document.getElementById("note-title").value = "";
      document.getElementById("note-content").value = "";
      setStatus("メモを保存しました");
      await loadNotes();
    });

    async function loadNotes() {
      const { data, error } = await sb
        .from("notes")
        .select("*")
        .order("updated_at", { ascending: false });
      if (error) return setStatus("メモ読込エラー: " + error.message);

      notesList.innerHTML = "";
      if (!data || data.length === 0) {
        notesList.innerHTML = '<div style="color:var(--text-sub);font-size:14px;padding:8px 0;">メモはまだありません</div>';
        return;
      }

      data.forEach((n) => {
        const div = document.createElement("div");
        div.className = "row";
        div.innerHTML = `
          <div style="flex:1; word-break: break-all;">
            <strong style="font-size:15px; color:var(--text-main);">${escapeHtml(n.title)}</strong>
            <div style="white-space:pre-wrap; color:var(--text-sub); font-size:14px; margin-top:4px;">${escapeHtml(n.content)}</div>
          </div>
          <button class="danger btn-del" style="padding:6px 10px;font-size:12px;">削除</button>
        `;
        div.querySelector(".btn-del").addEventListener("click", async () => {
          const { error: delErr } = await sb.from("notes").delete().eq("id", n.id);
          if (delErr) setStatus("削除エラー: " + delErr.message);
          else {
            setStatus("メモを削除しました");
            await loadNotes();
          }
        });
        notesList.appendChild(div);
      });
    }

    document.getElementById("upload-btn").addEventListener("click", async () => {
      if (!currentUser) return;
      const file = document.getElementById("file-input").files[0];
      if (!file) return setStatus("ファイルを選んでください");
      const path = `${currentUser.id}/${Date.now()}_${file.name}`;
      setStatus("アップロード中...");
      const { error } = await sb.storage.from(BUCKET).upload(path, file);
      if (error) return setStatus("アップロードエラー: " + error.message);
      document.getElementById("file-input").value = "";
      setStatus("アップロード完了しました");
      await loadFiles();
    });

    async function loadFiles() {
      if (!currentUser) return;
      const { data, error } = await sb.storage.from(BUCKET).list(currentUser.id, {
        sortBy: { column: "created_at", order: "desc" }
      });
      if (error) return setStatus("ファイル一覧エラー: " + error.message);

      filesList.innerHTML = "";
      const validFiles = (data || []).filter((f) => f.name !== ".emptyFolderPlaceholder");
      if (validFiles.length === 0) {
        filesList.innerHTML = '<div style="color:var(--text-sub);font-size:14px;padding:8px 0;">ファイルはまだありません</div>';
        return;
      }

      validFiles.forEach((f) => {
        const fullPath = `${currentUser.id}/${f.name}`;
        const div = document.createElement("div");
        div.className = "row";
        div.innerHTML = `
          <span style="word-break: break-all; flex:1; font-size:14px; color:var(--text-main);">${escapeHtml(f.name)}</span>
          <div class="btn-group">
            <button class="secondary btn-open" style="padding:6px 10px;font-size:12px;">開く</button>
            <button class="secondary btn-download" style="padding:6px 10px;font-size:12px;">DL</button>
            <button class="danger btn-del" style="padding:6px 10px;font-size:12px;">削除</button>
          </div>
        `;
        div.querySelector(".btn-open").addEventListener("click", async () => {
          const { data: signed, error: urlErr } = await sb.storage.from(BUCKET).createSignedUrl(fullPath, 60);
          if (urlErr) setStatus("URL発行エラー: " + urlErr.message);
          else window.open(signed.signedUrl, "_blank");
        });
        div.querySelector(".btn-download").addEventListener("click", async () => {
          const { data: signed, error: urlErr } = await sb.storage.from(BUCKET).createSignedUrl(fullPath, 60, { download: f.name });
          if (urlErr) setStatus("URL発行エラー: " + urlErr.message);
          else window.open(signed.signedUrl, "_blank");
        });
        div.querySelector(".btn-del").addEventListener("click", async () => {
          const { error: delErr } = await sb.storage.from(BUCKET).remove([fullPath]);
          if (delErr) setStatus("削除エラー: " + delErr.message);
          else {
            setStatus("ファイルを削除しました");
            await loadFiles();
          }
        });
        filesList.appendChild(div);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    sb.auth.onAuthStateChange(async (_event, session) => {
      currentUser = session?.user || null;
      if (currentUser) {
        authBox.classList.add("hidden");
        appBox.classList.remove("hidden");
        headerUser.classList.remove("hidden");
        userEmail.textContent = currentUser.email;
        await Promise.all([loadNotes(), loadFiles()]);
      } else {
        authBox.classList.remove("hidden");
        appBox.classList.add("hidden");
        headerUser.classList.add("hidden");
        userEmail.textContent = "";
      }
    });

    // ── YouTube 検索＆再生機能 ──
    const YT_API_KEY = "AIzaSyDJtY2Bx-lGDt5h_JcQZ4WyI-4i2KseCtQ";
    const ytInputEl = document.getElementById("yt-query");
    const ytBtnEl = document.getElementById("yt-search-btn");
    const ytResultsEl = document.getElementById("yt-results");
    const ytPlayerWrapEl = document.getElementById("yt-player-wrap");
    const ytPlayerEl = document.getElementById("yt-player");

    function escapeYtHtml(str) {
      return str.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    }

    async function searchYouTube() {
      const q = ytInputEl.value.trim();
      if (!q) return;
      ytResultsEl.innerHTML = "<p>検索中...</p>";
      const url = new URL("https://www.googleapis.com/youtube/v3/search");
      url.searchParams.set("part", "snippet");
      url.searchParams.set("type", "video");
      url.searchParams.set("maxResults", "6");
      url.searchParams.set("q", q);
      url.searchParams.set("key", YT_API_KEY);

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) {
          ytResultsEl.innerHTML = `<p>検索エラー: ${escapeYtHtml(data.error?.message || "取得できませんでした")}</p>`;
          return;
        }
        if (!data.items || data.items.length === 0) {
          ytResultsEl.innerHTML = "<p>動画が見つかりませんでした。</p>";
          return;
        }
        ytResultsEl.innerHTML = "";
        data.items.forEach((item) => {
          const videoId = item.id?.videoId;
          const title = item.snippet?.title || "タイトルなし";
          const thumb = item.snippet?.thumbnails?.medium?.url || "";
          if (!videoId) return;

          const card = document.createElement("div");
          card.style.cssText = "display:flex; gap:10px; align-items:center; padding:8px; border:1px solid var(--border-color); border-radius:8px; background:var(--card-bg);";
          card.innerHTML = `
            <img src="${thumb}" alt="" style="width:120px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; flex-shrink:0; cursor:pointer;" class="thumb-click" />
            <div style="flex-grow:1; font-size:14px; line-height:1.4; cursor:pointer; color:var(--text-main);" class="thumb-click">${escapeYtHtml(title)}</div>
            <button type="button" class="secondary watch-later-btn" style="padding:4px 8px; font-size:12px; cursor:pointer; flex-shrink:0;" title="あとで見るに追加">📌</button>
          `;

          card.querySelectorAll(".thumb-click").forEach(el => {
            el.addEventListener("click", () => {
              ytPlayerEl.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
              ytPlayerWrapEl.style.display = "block";
              ytPlayerWrapEl.scrollIntoView({behavior: "smooth", block: "nearest"});
              addToHistory(videoId, title);
            });
          });

          card.querySelector(".watch-later-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            addToWatchLater(videoId, title);
          });

          ytResultsEl.appendChild(card);
        });
      } catch (err) {
        ytResultsEl.innerHTML = "<p>通信エラーが発生しました。</p>";
      }
    }

    ytBtnEl.addEventListener("click", searchYouTube);
    ytInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchYouTube();
    });

    // ── 視聴履歴とあとで見るの保存機能 ──
    function getSavedVideos(key) {
      return JSON.parse(localStorage.getItem(key)) || [];
    }
    function saveVideo(key, videoId, title) {
      let list = getSavedVideos(key);
      list = list.filter(item => item.id !== videoId);
      list.unshift({ id: videoId, title: title });
      if (list.length > 20) list.pop();
      localStorage.setItem(key, JSON.stringify(list));
    }
    function addToHistory(videoId, title) {
      saveVideo('watch_history', videoId, title);
    }
    function addToWatchLater(videoId, title) {
      saveVideo('watch_later', videoId, title);
      alert('「あとで見る」に追加しました！');
    }

    // ── ダークモード切り替え処理 ──
    const themeBtn = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      if (themeBtn) themeBtn.textContent = '☀️ ライトモード';
    }
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        themeBtn.textContent = isDark ? '☀️ ライトモード' : '🌙 ダークモード';
      });
    }

    // ── 履歴・あとで見るの一覧表示＆削除処理 ──
    const savedWrap = document.getElementById('saved-list-wrap');
    const savedTitle = document.getElementById('saved-list-title');
    const savedListEl = document.getElementById('saved-list');
    let currentKey = '';

    function renderSavedList(key, headingText) {
      currentKey = key;
      const list = getSavedVideos(key);
      savedTitle.textContent = headingText;
      savedListEl.innerHTML = '';
      
      if (list.length === 0) {
        savedListEl.innerHTML = '<p style="font-size:13px; color:var(--text-sub); margin:0;">まだ動画がありません。</p>';
      } else {
        list.forEach(item => {
          const row = document.createElement('div');
